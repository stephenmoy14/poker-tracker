# Keeps the free Supabase project from pausing between games by calling the
# database's ping() function once a day.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions →
# New repository secret, add both:
#   SUPABASE_URL       your Project URL, e.g. https://abcd.supabase.co
#   SUPABASE_ANON_KEY  the publishable (sb_publishable_...) or anon key
# Then Actions → Keep Supabase awake → Run workflow, to check it works.
#
# GitHub turns off scheduled workflows in repos with no commits for 60 days
# (it emails you first); re-enable it from the Actions tab.

name: Keep Supabase awake

on:
  schedule:
    - cron: "23 14 * * *" # every day at 14:23 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets (see the comment at the top of this file)."
            exit 1
          fi
          response=$(curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase answered: $response"
          if [ "$response" != '"ok"' ]; then
            echo "::error::Unexpected answer from ping(). If the project is paused, resume it in the Supabase dashboard."
            exit 1
          fi
